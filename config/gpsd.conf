# gpsd default configuration
#
# Based on real system:
# - u-blox 7 USB receiver on /dev/ttyACM0 at 9600 baud
# - PPS device on /dev/pps0
# - gpsd started with: /usr/sbin/gpsd -n /dev/ttyACM0 /dev/pps0
#
# The -n flag is critical: it tells gpsd to start polling the GPS
# immediately without waiting for a client connection. This ensures
# SHM segments are populated for Chrony from boot.

# Devices to monitor
DEVICES="/dev/ttyACM0 /dev/pps0"

# -n: don't wait for client, start reading GPS immediately
# This is essential for NTP use - Chrony needs data at boot
GPSD_OPTIONS="-n"

# USB hotplug support
USBAUTO="true"
