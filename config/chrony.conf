# Chrony configuration for GPS-disciplined NTP server
#
# Based on real system data:
# - GPS via gpsd SHM refclock (SHM 0) on /dev/ttyACM0
# - PPS via gpsd SHM refclock (SHM 1) on /dev/pps0
# - gpsd running with: /usr/sbin/gpsd -n /dev/ttyACM0 /dev/pps0
#
# Real-world observations:
# - GPS time offset ~189ms (from cgps "Time offset: 0.189318451 s")
# - GPS currently NO FIX but time still being provided
# - PPS reachability 0 (no PPS lock without fix)
# - NTP servers showing ~140ms offset (network latency to AU servers)

# ─── GPS Reference Clock (SHM 0) ─────────────────────────────────────
# gpsd writes GPS time to shared memory segment 0.
# refid GPS identifies this source in chronyc output.
# offset 0.2: compensates for ~200ms serial data delay (observed ~189ms).
# delay 0.2: maximum expected delay from the GPS receiver.
# noselect is NOT used because even without a perfect fix, GPS time
#   from u-blox is still usable as a coarse reference.
# poll 4: poll every 16 seconds (2^4).
# precision 1e-1: GPS-only precision is ~100ms (no PPS).
refclock SHM 0  refid GPS  offset 0.2  delay 0.2  poll 4  precision 1e-1

# ─── PPS Reference Clock (SHM 1) ─────────────────────────────────────
# gpsd writes PPS timestamps to shared memory segment 1.
# PPS provides microsecond-level precision WHEN available.
# lock GPS: PPS needs GPS to resolve second ambiguity.
# prefer: when PPS is working, it should be the preferred source.
# Currently PPS shows reachability 0 (no lock) because GPS has no fix.
refclock SHM 1  refid PPS  lock GPS  precision 1e-7  poll 4  prefer

# ─── Network NTP Servers (fallback) ──────────────────────────────────
# These provide fallback time when GPS is unavailable.
# From real data, AU pool servers show ~140ms offset.
# iburst: send burst of requests on startup for fast initial sync.
pool 2.debian.pool.ntp.org  iburst

# ─── Server Configuration ────────────────────────────────────────────
# Allow NTP clients on local network
allow 192.168.0.0/16
allow 10.0.0.0/8
allow 172.16.0.0/12

# Serve time even when not fully synchronized
local stratum 10

# ─── Drift and Logging ───────────────────────────────────────────────
driftfile /var/lib/chrony/drift
logdir /var/log/chrony
log tracking measurements statistics refclocks

# ─── Leap Second Handling ────────────────────────────────────────────
leapsectz right/UTC

# ─── RTC (Real-Time Clock) ───────────────────────────────────────────
# Correct the RTC on shutdown
rtcsync

# ─── Makestep ─────────────────────────────────────────────────────────
# Allow a large step adjustment in the first 3 updates,
# needed because GPS offset can be hundreds of ms initially.
makestep 1.0 3
